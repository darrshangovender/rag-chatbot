[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Public reference implementation of a hybrid-retrieval, citation-guarded RAG chatbot."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Darrshan Govender", email = "darrshangovender@gmail.com" }]
keywords = ["rag", "retrieval", "hybrid-search", "citations", "fastapi", "llm"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "markdown-it-py>=3.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "sentence-transformers>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/darrshangovender/rag-chatbot"
Issues = "https://github.com/darrshangovender/rag-chatbot/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
